<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Join our NewsLetter.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Poppins", sans-serif;
        text-align: center;
      }
      img {
        padding: 20px;
      }
      h1 {
        padding: 0px;
        font-size: 48px;
        font-weight: 600;
      }
      article {
        color: #6c727f;
        font-size: 20px;
        font-weight: 400;
      }
      article p {
        padding: 3px 20px 40px 20px;
        margin: 10px auto;
        max-width: 800px;
      }
      .box {
        border: 2px solid black;
        border-radius: 10px;
        /* font-weight:400 ; */
        /* display: flex;
            align-items: center;
            justify-content: center; */
        width: 35%;
        height: 40%;
        margin: 40px auto;
      }
      input {
        border: 2px solid black;
        color: #394150;
        background-color: #f9fafb;
        padding: 15px 50px;
        margin: 15px 0px;
        text-align: center;
        font-size: 16px;
        font-weight: 500;
        border-radius: 10px;
        width: 70%;
      }
      #blue {
        border-radius: 10px;
        background-color: #284bce;
        color: #ffffff;
        border: none;
        font-size: 16px;
        padding: 15px 100px;
        margin: 5px 0px;
        width: 90%;
      }
      .box p {
        color: #6c727f;
        font-size: 12px;
      }
      @media (max-width: 768px) {
        h1 {
          font-size: 36px;
        }

        article p {
          margin: 10px 20px;
          padding: 3px 10px 30px;
        }

        .box {
          width: 90%;
          margin: 30px auto;
        }

        input {
          width: 90%;
          padding: 15px;
        }

        #blue {
          width: 90%;
          padding: 15px;
        }
      }
    </style>
  </head>
  <body>
    <img src="logo.svg" alt="logo" />
    <h1>Join our newsletter</h1>
    <article>
      <p>
        Keep up with our latest collections, exclusive deals, and special
        offers! We introduce a new collection every week, so stay tuned to snag
        the hottest items just for you.
      </p>
    </article>
    <div class="box">
      <input type="email" placeholder="Enter your email address" />
      <button id="blue">Subscribe now</button>
      <p>Your email is 100% confidential and won't send you any spam.</p>
    </div>
  </body>
</html>
